# Maven
# Build your Java project and run tests with Apache Maven.
# Add steps that analyze code, save build artifacts, deploy, and more:
# https://docs.microsoft.com/azure/devops/pipelines/languages/java

trigger:
- main  # The pipeline will be triggered automatically on commits to the 'main' branch

pool:
  vmImage: 'ubuntu-latest'  # Using Ubuntu agent for the build

steps:
- task: Maven@3  # Using the Maven task to build and test your project
  inputs:
    mavenPomFile: 'pom.xml'  # Path to the pom.xml file
    goals: 'package'  # Build the project and package it as a JAR
    javaHomeOption: 'JDKVersion'  # Specify the Java version to use
    jdkVersionOption: '1.11'  # Set the Java version to 11
    mavenVersionOption: 'Default'  # Use the default Maven version
    publishJUnitResults: true  # Publish test results in the build summary
    testResultsFiles: '**/surefire-reports/TEST-*.xml'  # Path to the test result files generated by Maven Surefire Plugin


